# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Platform test"

on:
  pull_request:
  push:
    branches:
      - "2.1.x"

concurrency:
  group: platform-test-${{ github.head_ref || github.run_id }} # will be canceled on subsequent pushes in pull requests but not branches
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: "Platform test"
    runs-on: "ubuntu-latest"
    env:
      MYSQL_HOST: '127.0.0.1'
      PGSQL_HOST: '127.0.0.1'

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
        update-packages:
          - ""
        include:
          - php-version: "8.1"
            update-packages: doctrine/orm:^3.0 doctrine/dbal:^4.0 carbonphp/carbon-doctrine-types:^3 gedmo/doctrine-extensions:^3
          - php-version: "8.2"
            update-packages: doctrine/orm:^3.0 doctrine/dbal:^4.0 carbonphp/carbon-doctrine-types:^3 gedmo/doctrine-extensions:^3
          - php-version: "8.3"
            update-packages: doctrine/orm:^3.0 doctrine/dbal:^4.0 carbonphp/carbon-doctrine-types:^3 gedmo/doctrine-extensions:^3
          - php-version: "8.4"
            update-packages: doctrine/orm:^3.0 doctrine/dbal:^4.0 carbonphp/carbon-doctrine-types:^3 gedmo/doctrine-extensions:^3

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # v2
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          ini-file: development
          extensions: pdo, mysqli, pgsql, pdo_mysql, pdo_pgsql, pdo_sqlite, mongodb

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress"

      - name: "Update packages"
        if: ${{ matrix.update-packages != '' }}
        env:
          UPDATE_PACKAGES: ${{ matrix.update-packages }}
        run: |
          # shellcheck disable=SC2086 # UPDATE_PACKAGES is a space-separated list of packages
          composer require --dev $UPDATE_PACKAGES -W

      - name: "Run platform matrix test"
        run: vendor/bin/phpunit --group=platform

    services:
      # Platform tests deliberately run against the newest database server releases
      postgres:
        image: "postgres:latest" # zizmor: ignore[unpinned-images]
        env:
          POSTGRES_PASSWORD: "secret"
          POSTGRES_USER: root
          POSTGRES_DB: foo
        ports:
          - "5432:5432"

      mysql:
        image: "mysql:latest" # zizmor: ignore[unpinned-images]
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: foo
        ports:
          - "3306:3306"
